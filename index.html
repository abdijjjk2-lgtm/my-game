<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Battle Royale 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Cairo',sans-serif;background:#000;color:#fff;touch-action:none}
canvas{display:block}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;border:2px solid #0f0;border-radius:50%;opacity:0.7}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#0f0}
#crosshair::before{width:2px;height:8px;top:50%;left:50%;transform:translate(-50%,-50%)}
#crosshair::after{width:8px;height:2px;top:50%;left:50%;transform:translate(-50%,-50%)}
#health-bar{position:absolute;bottom:20px;left:20px;width:200px;height:20px;background:rgba(0,0,0,0.6);border:2px solid #fff;border-radius:10px;overflow:hidden}
#health-fill{height:100%;background:linear-gradient(90deg,#f00,#0f0);width:100%;transition:width 0.3s}
#health-text{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;text-shadow:1px 1px 2px #000}
#ammo{position:absolute;bottom:20px;right:20px;font-size:32px;font-weight:900;color:#f4d03f;text-shadow:2px 2px 4px #000}
#players-count{position:absolute;top:20px;right:20px;font-size:20px;font-weight:900;color:#f4d03f;background:rgba(0,0,0,0.6);padding:8px 16px;border-radius:10px;border:2px solid #d4af37}
#game-over{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;pointer-events:all}
#game-over h1{font-size:60px;color:#d4af37;margin-bottom:20px;text-shadow:0 0 30px #d4af37}
#game-over p{font-size:24px;color:#fff;margin-bottom:30px}
#game-over button{background:linear-gradient(135deg,#d4af37,#8b6914);color:#000;border:none;padding:15px 40px;font-size:20px;font-weight:900;border-radius:12px;cursor:pointer;font-family:'Cairo',sans-serif;box-shadow:0 0 30px rgba(212,175,55,0.5)}
#joystick-left{position:absolute;bottom:100px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);pointer-events:all;display:none}
#joystick-left-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(212,175,55,0.6);border:2px solid #d4af37}
#joystick-right{position:absolute;bottom:100px;right:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);pointer-events:all;display:none}
#joystick-right-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,51,75,0.6);border:2px solid #ff334b}
#fire-btn{position:absolute;bottom:180px;right:60px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff334b,#a00);border:3px solid #fff;pointer-events:all;display:none;font-size:30px;color:#fff;font-weight:900;cursor:pointer}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0805;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
#loading h1{color:#d4af37;font-size:40px;margin-bottom:20px;text-shadow:0 0 30px #d4af37}
#loading p{color:#fff;font-size:18px}
.spinner{width:60px;height:60px;border:4px solid rgba(212,175,55,0.2);border-top-color:#d4af37;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
#instructions{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-size:18px;background:rgba(0,0,0,0.7);padding:30px;border-radius:20px;border:2px solid #d4af37;pointer-events:all;display:none}
#instructions h2{color:#d4af37;margin-bottom:15px}
#instructions button{background:linear-gradient(135deg,#d4af37,#8b6914);color:#000;border:none;padding:12px 30px;font-size:18px;font-weight:900;border-radius:10px;cursor:pointer;font-family:'Cairo',sans-serif;margin-top:20px}
</style>
</head>
<body>

<div id="loading">
<div class="spinner"></div>
<h1>⚔️ Battle Royale 3D</h1>
<p>جاري التحميل...</p>
</div>

<div id="ui">
<div id="crosshair"></div>
<div id="players-count">👥 <span id="alive-count">10</span></div>
<div id="health-bar">
<div id="health-fill"></div>
<div id="health-text">100</div>
</div>
<div id="ammo">🔫 <span id="ammo-count">30</span></div>
<div id="joystick-left"><div id="joystick-left-knob"></div></div>
<div id="joystick-right"><div id="joystick-right-knob"></div></div>
<button id="fire-btn">🔥</button>
</div>

<div id="instructions">
<h2>كيف تلعب؟</h2>
<p>💻 على الكمبيوتر: WASD للحركة + الماوس للتصويب + زر الماوس الأيسر للإطلاق</p>
<p>📱 على الموبايل: عصا يسار للحركة + عصا يمين للتصويب + زر 🔥 للإطلاق</p>
<button onclick="startGame()">ابدأ اللعب</button>
</div>

<div id="game-over">
<h1 id="game-over-title">💀 انتهت اللعبة</h1>
<p id="game-over-msg">حاول مرة أخرى</p>
<button onclick="restartGame()">🔄 العب مرة أخرى</button>
</div>

<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.160.0/build/three.module.js"
}
}
</script>

<script type="module">
import * as THREE from 'three';

let scene, camera, renderer;
let player, playerVelocity;
let bots = [];
let bullets = [];
let keys = {};
let mouseX = 0, mouseY = 0;
let isLocked = false;
let ammo = 30;
let health = 100;
let aliveCount = 10;
let gameRunning = false;
let clock;
let collidables = [];
let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const WORLD_SIZE = 100;
const PLAYER_SPEED = 12;
const BULLET_SPEED = 60;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 30, 100);
  
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
  
  renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
  renderer.shadowMap.enabled = !isMobile;
  document.body.appendChild(renderer.domElement);
  
  clock = new THREE.Clock();
  
  createLighting();
  createGround();
  createObstacles();
  createPlayer();
  createBots();
  setupControls();
  
  window.addEventListener('resize', onResize);
  
  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('instructions').style.display = 'block';
  }, 1000);
}

function createLighting() {
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.position.set(50, 100, 50);
  if (!isMobile) {
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
  }
  scene.add(sun);
}

function createGround() {
  const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, 20, 20);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a7d3a });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  
  const roadGeo = new THREE.PlaneGeometry(8, WORLD_SIZE);
  const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  scene.add(road);
  
  const road2 = new THREE.Mesh(roadGeo, roadMat);
  road2.rotation.x = -Math.PI / 2;
  road2.rotation.z = Math.PI / 2;
  road2.position.y = 0.01;
  scene.add(road2);
  
  for (let i = 0; i < 40; i++) {
    const x = (Math.random() - 0.5) * WORLD_SIZE;
    const z = (Math.random() - 0.5) * WORLD_SIZE;
    if (Math.abs(x) < 10 || Math.abs(z) < 10) continue;
    const treeGroup = new THREE.Group();
    
    const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3a1e });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1;
    if (!isMobile) trunk.castShadow = true;
    treeGroup.add(trunk);
    
    const leavesGeo = new THREE.ConeGeometry(1.5, 3, 6);
    const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2d5016 });
    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
    leaves.position.y = 3.5;
    if (!isMobile) leaves.castShadow = true;
    treeGroup.add(leaves);
    
    treeGroup.position.set(x, 0, z);
    scene.add(treeGroup);
    collidables.push({ x, z, radius: 0.8 });
  }
}

function createObstacles() {
  const buildingMat = new THREE.MeshLambertMaterial({ color: 0x8b6f47 });
  const roofMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2e });
  
  for (let i = 0; i < 15; i++) {
    const x = (Math.random() - 0.5) * (WORLD_SIZE - 20);
    const z = (Math.random() - 0.5) * (WORLD_SIZE - 20);
    if (Math.abs(x) < 10 || Math.abs(z) < 10) continue;
    
    const w = 6 + Math.random() * 6;
    const h = 4 + Math.random() * 4;
    const d = 6 + Math.random() * 6;
    
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      buildingMat
    );
    building.position.set(x, h / 2, z);
    if (!isMobile) {
      building.castShadow = true;
      building.receiveShadow = true;
    }
    scene.add(building);
    collidables.push({ x, z, radius: Math.max(w, d) / 2 });
    
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.5, 0.3, d + 0.5),
      roofMat
    );
    roof.position.set(x, h + 0.15, z);
    scene.add(roof);
  }
  
  for (let i = 0; i < 20; i++) {
    const x = (Math.random() - 0.5) * WORLD_SIZE;
    const z = (Math.random() - 0.5) * WORLD_SIZE;
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.MeshLambertMaterial({ color: 0x8b6914 })
    );
    box.position.set(x, 0.75, z);
    if (!isMobile) box.castShadow = true;
    scene.add(box);
    collidables.push({ x, z, radius: 1 });
  }
}

let weaponMesh;

function createPlayer() {
  player = new THREE.Group();
  
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 1.6, 0.5),
    new THREE.MeshLambertMaterial({ color: 0x2c5f8d })
  );
  body.position.y = 1.6;
  body.castShadow = true;
  player.add(body);
  
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 16, 16),
    new THREE.MeshLambertMaterial({ color: 0xf4c89b })
  );
  head.position.y = 2.75;
  head.castShadow = true;
  player.add(head);
  
  const legL = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.8, 0.3),
    new THREE.MeshLambertMaterial({ color: 0x1a1a1a })
  );
  legL.position.set(-0.2, 0.4, 0);
  legL.castShadow = true;
  player.add(legL);
  
  const legR = legL.clone();
  legR.position.x = 0.2;
  player.add(legR);
  
  const armL = new THREE.Mesh(
    new THREE.BoxGeometry(0.25, 0.7, 0.25),
    new THREE.MeshLambertMaterial({ color: 0x2c5f8d })
  );
  armL.position.set(-0.55, 1.75, 0);
  armL.castShadow = true;
  player.add(armL);
  
  const armR = armL.clone();
  armR.position.x = 0.55;
  player.add(armR);
  
  weaponMesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 0.15, 1.2),
    new THREE.MeshLambertMaterial({ color: 0x1a1a1a })
  );
  weaponMesh.position.set(0.55, 1.6, -0.6);
  player.add(weaponMesh);
  
  player.position.set(0, 0, 0);
  scene.add(player);
}

function createBots() {
  for (let i = 0; i < 9; i++) {
    const bot = createBotModel();
    const angle = (i / 9) * Math.PI * 2;
    const distance = 30 + Math.random() * 30;
    bot.position.set(
      Math.cos(angle) * distance,
      0,
      Math.sin(angle) * distance
    );
    bot.userData = {
      health: 100,
      speed: 3 + Math.random() * 2,
      lastShot: 0,
      direction: Math.random() * Math.PI * 2,
      changeDirTime: 0
    };
    scene.add(bot);
    bots.push(bot);
  }
}

function createBotModel() {
  const bot = new THREE.Group();
  
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 1.6, 0.5),
    new THREE.MeshLambertMaterial({ color: 0x8b2020 })
  );
  body.position.y = 1.6;
  body.castShadow = true;
  bot.add(body);
  
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 16, 16),
    new THREE.MeshLambertMaterial({ color: 0xf4c89b })
  );
  head.position.y = 2.75;
  head.castShadow = true;
  bot.add(head);
  
  const legL = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.8, 0.3),
    new THREE.MeshLambertMaterial({ color: 0x1a1a1a })
  );
  legL.position.set(-0.2, 0.4, 0);
  bot.add(legL);
  
  const legR = legL.clone();
  legR.position.x = 0.2;
  bot.add(legR);
  
  return bot;
}

function setupControls() {
  document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
  });
  document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });
  
  if (!isMobile) {
    document.addEventListener('click', () => {
      if (gameRunning && !isLocked) {
        renderer.domElement.requestPointerLock();
      }
    });
    
    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === renderer.domElement;
    });
    
    document.addEventListener('mousemove', (e) => {
      if (isLocked && gameRunning) {
        mouseX -= e.movementX * 0.002;
        mouseY -= e.movementY * 0.002;
        mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
      }
    });
    
    document.addEventListener('mousedown', (e) => {
      if (e.button === 0 && gameRunning && isLocked) {
        shoot();
      }
    });
  } else {
    setupMobileControls();
  }
}

let leftJoystickActive = false;
let rightJoystickActive = false;
let leftJoystickVec = { x: 0, y: 0 };
let rightJoystickVec = { x: 0, y: 0 };

function setupMobileControls() {
  document.getElementById('joystick-left').style.display = 'block';
  document.getElementById('joystick-right').style.display = 'block';
  document.getElementById('fire-btn').style.display = 'block';
  
  setupJoystick('joystick-left', 'joystick-left-knob', (vec) => {
    leftJoystickVec = vec;
  });
  
  setupJoystick('joystick-right', 'joystick-right-knob', (vec) => {
    rightJoystickVec = vec;
  });
  
  let lastFire = 0;
  const fireBtn = document.getElementById('fire-btn');
  fireBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (Date.now() - lastFire > 150) {
      shoot();
      lastFire = Date.now();
    }
  });
}

function setupJoystick(baseId, knobId, callback) {
  const base = document.getElementById(baseId);
  const knob = document.getElementById(knobId);
  let active = false;
  let startX, startY;
  
  const handleStart = (e) => {
    e.preventDefault();
    active = true;
    const rect = base.getBoundingClientRect();
    startX = rect.left + rect.width / 2;
    startY = rect.top + rect.height / 2;
  };
  
  const handleMove = (e) => {
    if (!active) return;
    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = 50;
    const clampedDist = Math.min(dist, maxDist);
    const angle = Math.atan2(dy, dx);
    const kx = Math.cos(angle) * clampedDist;
    const ky = Math.sin(angle) * clampedDist;
    knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
    callback({ x: kx / maxDist, y: ky / maxDist });
  };
  
  const handleEnd = (e) => {
    e.preventDefault();
    active = false;
    knob.style.transform = 'translate(-50%, -50%)';
    callback({ x: 0, y: 0 });
  };
  
  base.addEventListener('touchstart', handleStart);
  base.addEventListener('touchmove', handleMove);
  base.addEventListener('touchend', handleEnd);
}

function shoot() {
  if (ammo <= 0) return;
  ammo--;
  document.getElementById('ammo-count').textContent = ammo;
  
  const bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
  const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  const bullet = new THREE.Mesh(bulletGeo, bulletMat);
  
  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);
  
  bullet.position.copy(camera.position);
  bullet.position.add(direction.clone().multiplyScalar(1.5));
  
  bullet.userData = {
    velocity: direction.clone().multiplyScalar(BULLET_SPEED),
    life: 3,
    isPlayerBullet: true
  };
  
  scene.add(bullet);
  bullets.push(bullet);
}

function checkCollision(x, z) {
  for (const obs of collidables) {
    const dx = x - obs.x;
    const dz = z - obs.z;
    if (dx * dx + dz * dz < obs.radius * obs.radius) {
      return true;
    }
  }
  return false;
}

function updatePlayer(delta) {
  let moveX = 0;
  let moveZ = 0;
  
  if (isMobile) {
    moveX = leftJoystickVec.x;
    moveZ = leftJoystickVec.y;
    if (rightJoystickActive || rightJoystickVec.x !== 0 || rightJoystickVec.y !== 0) {
      if (Math.abs(rightJoystickVec.x) > 0.1 || Math.abs(rightJoystickVec.y) > 0.1) {
        mouseX -= rightJoystickVec.x * 0.08;
        mouseY -= rightJoystickVec.y * 0.08;
        mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
      }
    }
  } else {
    if (keys['KeyW'] || keys['ArrowUp']) moveZ = -1;
    if (keys['KeyS'] || keys['ArrowDown']) moveZ = 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX = -1;
    if (keys['KeyD'] || keys['ArrowRight']) moveX = 1;
  }
  
  const dirX = Math.sin(mouseX);
  const dirZ = Math.cos(mouseX);
  
  const forward = moveZ;
  const right = moveX;
  
  const newX = player.position.x + (forward * dirX + right * dirZ) * PLAYER_SPEED * delta;
  const newZ = player.position.z + (forward * dirZ - right * dirX) * PLAYER_SPEED * delta;
  
  if (!checkCollision(newX, player.position.z)) {
    player.position.x = newX;
  }
  if (!checkCollision(player.position.x, newZ)) {
    player.position.z = newZ;
  }
  
  player.position.x = Math.max(-WORLD_SIZE / 2 + 2, Math.min(WORLD_SIZE / 2 - 2, player.position.x));
  player.position.z = Math.max(-WORLD_SIZE / 2 + 2, Math.min(WORLD_SIZE / 2 - 2, player.position.z));
  
  player.rotation.y = mouseX;
  
  camera.position.set(
    player.position.x,
    player.position.y + 2.5,
    player.position.z
  );
  
  const camDirX = Math.sin(mouseX) * Math.cos(mouseY);
  const camDirY = Math.sin(mouseY);
  const camDirZ = Math.cos(mouseX) * Math.cos(mouseY);
  
  camera.lookAt(
    camera.position.x + camDirX,
    camera.position.y + camDirY,
    camera.position.z + camDirZ
  );
}

function updateBots(delta) {
  const now = performance.now() / 1000;
  
  bots.forEach((bot, index) => {
    if (!bot.userData.alive) return;
    
    const data = bot.userData;
    
    if (now - data.changeDirTime > 3) {
      data.direction = Math.random() * Math.PI * 2;
      data.changeDirTime = now;
    }
    
    const dx = Math.sin(data.direction) * data.speed * delta;
    const dz = Math.cos(data.direction) * data.speed * delta;
    
    const newX = bot.position.x + dx;
    const newZ = bot.position.z + dz;
    
    if (!checkCollision(newX, newZ) && 
        Math.abs(newX) < WORLD_SIZE / 2 - 2 && 
        Math.abs(newZ) < WORLD_SIZE / 2 - 2) {
      bot.position.x = newX;
      bot.position.z = newZ;
    } else {
      data.direction += Math.PI;
    }
    
    bot.lookAt(player.position.x, bot.position.y, player.position.z);
    
    const distToPlayer = Math.sqrt(
      Math.pow(bot.position.x - player.position.x, 2) +
      Math.pow(bot.position.z - player.position.z, 2)
    );
    
    if (distToPlayer < 30 && now - data.lastShot > 1.5) {
      data.lastShot = now;
      
      const bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);
      
      const dir = new THREE.Vector3(
        player.position.x - bot.position.x,
        1.6,
        player.position.z - bot.position.z
      ).normalize();
      
      bullet.position.set(bot.position.x, 1.6, bot.position.z);
      bullet.userData = {
        velocity: dir.multiplyScalar(BULLET_SPEED * 0.7),
        life: 3,
        isPlayerBullet: false
      };
      
      scene.add(bullet);
      bullets.push(bullet);
    }
  });
}

function updateBullets(delta) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bullet = bullets[i];
    bullet.position.add(bullet.userData.velocity.clone().multiplyScalar(delta));
    bullet.userData.life -= delta;
    
    let remove = false;
    
    if (bullet.userData.life <= 0) remove = true;
    
    if (Math.abs(bullet.position.x) > WORLD_SIZE / 2 ||
        Math.abs(bullet.position.z) > WORLD_SIZE / 2) {
      remove = true;
    }
    
    if (bullet.userData.isPlayerBullet) {
      for (const bot of bots) {
        if (!bot.userData.alive) continue;
        const dist = bullet.position.distanceTo(new THREE.Vector3(bot.position.x, 1.6, bot.position.z));
        if (dist < 0.8) {
          bot.userData.health -= 25;
          if (bot.userData.health <= 0) {
            bot.userData.alive = false;
            bot.visible = false;
            aliveCount--;
            document.getElementById('alive-count').textContent = aliveCount;
            if (aliveCount === 1) {
              endGame(true);
            }
          }
          remove = true;
          break;
        }
      }
    } else {
      const dist = bullet.position.distanceTo(new THREE.Vector3(player.position.x, 1.6, player.position.z));
      if (dist < 0.8) {
        health -= 10;
        document.getElementById('health-fill').style.width = health + '%';
        document.getElementById('health-text').textContent = Math.max(0, health);
        if (health <= 0) {
          endGame(false);
        }
        remove = true;
      }
    }
    
    if (remove) {
      scene.remove(bullet);
      bullet.geometry.dispose();
      bullet.material.dispose();
      bullets.splice(i, 1);
    }
  }
}

function endGame(won) {
  gameRunning = false;
  if (document.pointerLockElement) document.exitPointerLock();
  
  document.getElementById('game-over').style.display = 'flex';
  document.getElementById('game-over-title').textContent = won ? '🏆 فزت!' : '💀 خسرت';
  document.getElementById('game-over-msg').textContent = won ? 'أحسنت! أنت آخر من بقي' : 'حاول مرة أخرى';
}

function restartGame() {
  document.getElementById('game-over').style.display = 'none';
  
  bots.forEach(bot => scene.remove(bot));
  bullets.forEach(b => scene.remove(b));
  bots = [];
  bullets = [];
  aliveCount = 10;
  health = 100;
  ammo = 30;
  
  player.position.set(0, 0, 0);
  mouseX = 0;
  mouseY = 0;
  
  document.getElementById('alive-count').textContent = aliveCount;
  document.getElementById('health-fill').style.width = '100%';
  document.getElementById('health-text').textContent = '100';
  document.getElementById('ammo-count').textContent = ammo;
  
  createBots();
  gameRunning = true;
}

window.startGame = function() {
  document.getElementById('instructions').style.display = 'none';
  gameRunning = true;
  if (!isMobile) {
    renderer.domElement.requestPointerLock();
  }
};

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);
  
  if (gameRunning) {
    updatePlayer(delta);
    updateBots(delta);
    updateBullets(delta);
  }
  
  renderer.render(scene, camera);
}

init();
animate();
</script>

</body>
</html>
